name: Phase 0 soundness checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest --basetemp=.pytest-basetemp

  quality:
    name: Static checks and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: >-
          python -m ruff check src tests scripts
          benchmarks/proof-verification/scripts
      - name: Ruff format
        run: >-
          python -m ruff format --check src tests scripts
          benchmarks/proof-verification/scripts
      - name: Mypy strict
        run: python -m mypy src/robocert
      - name: Validate research ledger
        run: python scripts/check_ledger.py
      - name: Validate research report language
        run: python scripts/check_report_language.py research/reports
      - name: Validate all frozen proof-verification runs
        run: python benchmarks/proof-verification/scripts/check_rc002_run.py --all-runs
      - name: Check installed dependencies
        run: python -m pip check
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Inspect and clean-install distributions
        run: python scripts/check_distribution.py dist --work-dir .package-smoke

  formal:
    name: Lean 4 soundness proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The toolchain version is pinned by formal/lean-toolchain and is deliberately NOT
      # repeated here -- a second copy would be a second thing to keep in sync.
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/.lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Build
        run: lake build
        working-directory: formal
      # Fail closed. `lake build` only WARNS on `sorry`; this is the gate that actually
      # rejects an unproved theorem. See scripts/check_lean_axioms.py.
      - name: Axiom audit
        run: python scripts/check_lean_axioms.py
      # The axiom audit says the Lean theorem is proved. It says nothing about whether the
      # theorem is about the shipped code. This step is that bridge, and --require-lean is
      # what stops it passing green on a machine with no toolchain. `robocert` needs no
      # install here: it has no dependencies and the script puts `src/` on sys.path.
      - name: Lean/Python differential conformance
        run: python scripts/check_lean_conformance.py --require-lean

  rocq:
    name: Rocq exact polynomial identities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      # Rocq (the renamed Coq) has no single official apt package as of this writing; opam
      # is the community-standard, version-pinned installation method. NOTE: neither Rocq
      # nor opam is installed on the machine that authored this job -- the exact package
      # name/repo URL/version below is a best-effort first cut, not something re-run and
      # confirmed here. If it has drifted by the time this job actually runs, that is a
      # real finding to fix, not a sign the design is wrong. See
      # formal/attestations/planar2r-exact-witness.json, which records Rocq as pending for
      # exactly this reason.
      - name: Install opam
        run: sudo apt-get update && sudo apt-get install -y opam
      - name: Install pinned Rocq via opam
        run: |
          opam init -y --bare --disable-sandboxing
          opam switch create robocert ocaml-base-compiler
          eval "$(opam env --switch=robocert)"
          opam repo add rocq-released https://rocq-prover.org/opam/released
          opam install -y rocq-prover.9.0.0
          # `opam env` emits shell statements (`PATH='...'; export PATH;`), NOT the
          # KEY=value lines $GITHUB_ENV expects, so appending it propagates nothing; and
          # `opam var --switch=... bin` came back empty here too. Use the switch's
          # deterministic layout instead.
          echo "$HOME/.opam/robocert/bin" >> "$GITHUB_PATH"
      # Diagnostic and assertion in one. If Rocq is not runnable the job must stop HERE,
      # naming what is actually in the switch, rather than failing later with a bare
      # "not on PATH". Rocq 9 renamed `coqc` to `rocq compile`, so probe all spellings.
      - name: Confirm Rocq is runnable
        run: |
          echo "switch bin contents:"
          ls -1 "$HOME/.opam/robocert/bin" || true
          if command -v rocq >/dev/null; then rocq --version
          elif command -v rocqc >/dev/null; then rocqc --version
          elif command -v coqc >/dev/null; then coqc --version
          else echo "::error::no rocq/rocqc/coqc on PATH after opam install"; exit 1
          fi
      # --require rocq makes an absent toolchain a hard failure. Without it this job
      # passes green when Rocq is missing, which is a worse signal than a red build.
      # --emit-evidence captures what this run knows and the repository cannot reconstruct:
      # the exact toolchain string that accepted the proof. Digests recompute from committed
      # files any time; "which binary ran" does not. Without this the job proves the kernel
      # passed and leaves nothing behind to promote `rocq` out of pending_systems with.
      - name: Verify attestations (Rocq must actually be present)
        run: python scripts/check_attestations.py --require rocq --emit-evidence evidence
      - name: Upload Rocq run evidence
        uses: actions/upload-artifact@v4
        with:
          name: attestation-evidence-rocq
          path: evidence/
          if-no-files-found: error

  isabelle:
    name: Isabelle/HOL quantified semialgebraic cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      # Pinned release tarball, the method the Isabelle project itself documents for
      # non-interactive use. NOTE: Isabelle is not installed on the machine that authored
      # this job; the release name/URL below is a best-effort first cut. If Isabelle has
      # published a newer stable release by the time this job runs, update this URL and the
      # cache key together -- do not let them drift apart silently.
      - name: Cache Isabelle
        id: isabelle-cache
        uses: actions/cache@v4
        with:
          path: Isabelle2025
          key: isabelle2025-${{ runner.os }}
      - name: Install Isabelle2025
        if: steps.isabelle-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://isabelle.in.tum.de/website-Isabelle2025/dist/Isabelle2025_linux.tar.gz -o isabelle.tar.gz
          tar xzf isabelle.tar.gz
      - name: Add Isabelle to PATH
        run: echo "$PWD/Isabelle2025/bin" >> "$GITHUB_PATH"
      # DIAGNOSTIC ONLY -- nothing depends on this step and it cannot fail the job.
      #
      # Rocq's axiom dependencies are now extracted and checked (`Print Assumptions`, with a
      # planted-axiom positive control). Isabelle has no equivalent yet, and its allow-list is
      # empty, so an entry would have to assert `axioms: []` -- which is exactly the assertion
      # that must come from a run rather than from the policy's expectations.
      #
      # Rather than guess the introspection API blind, probe it. This is the same move as
      # commit 438367f ("Probe the Rocq 9 entry point"), which is what ended three rounds of
      # blind guessing at these jobs. A clean lemma and a deliberately `sorry`-ed one are put
      # side by side so the tainted shape is visible next to the untainted one. The extractor
      # gets written against whatever this prints, in a later change.
      - name: Probe Isabelle axiom/oracle introspection (diagnostic only)
        continue-on-error: true
        run: |
          isabelle version
          mkdir -p /tmp/isabelle-probe/Probe
          cat > /tmp/isabelle-probe/ROOT <<'ROOT_EOF'
          session Probe = HOL +
            options [document = false]
            directories
              Probe
            theories
              "Probe/Oracles"
          ROOT_EOF
          cat > /tmp/isabelle-probe/Probe/Oracles.thy <<'THY_EOF'
          theory Oracles imports Main begin

          lemma clean: "(1::nat) + 1 = 2" by simp
          lemma tainted: "(1::nat) + 1 = 3" sorry

          ML \<open>
            fun probe name thm =
              let val {oracle, unfinished, failed} = Thm.peek_status thm in
                writeln ("PROBE peek_status " ^ name ^
                         " oracle=" ^ Bool.toString oracle ^
                         " unfinished=" ^ Bool.toString unfinished ^
                         " failed=" ^ Bool.toString failed)
              end;
            probe "clean" @{thm clean};
            probe "tainted" @{thm tainted};
            writeln ("PROBE all_oracles clean=" ^
                     @{make_string} (Thm_Deps.all_oracles [@{thm clean}]));
            writeln ("PROBE all_oracles tainted=" ^
                     @{make_string} (Thm_Deps.all_oracles [@{thm tainted}]));
          \<close>

          end
          THY_EOF
          isabelle build -D /tmp/isabelle-probe -v
      # --require isabelle and --emit-evidence: see the equivalent notes in the rocq job.
      - name: Verify attestations (Isabelle must actually be present)
        run: python scripts/check_attestations.py --require isabelle --emit-evidence evidence
      - name: Upload Isabelle run evidence
        uses: actions/upload-artifact@v4
        with:
          name: attestation-evidence-isabelle
          path: evidence/
          if-no-files-found: error
