[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robocert"
version = "0.1.0a0"
description = "Auditable mathematical certification foundations for robotic systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["robotics", "certification", "formal-methods", "real-algebraic-geometry"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
robocert = "robocert.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "jsonschema>=4.23",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robocert"]

[tool.hatch.build.targets.wheel.force-include]
schemas = "robocert/schemas"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/robocert"]
